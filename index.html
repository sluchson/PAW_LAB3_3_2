<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dane NOAA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="view-selector-container">
    <label for="viewSelector">Wybierz widok:</label>
    <select id="viewSelector">
      <option value="stations" selected>Stacje (Com3_2.1)</option>
      <option value="datasets">Zbiory Danych (Com3_2.2)</option>
      <option value="data">Dane (Com3_2.3)</option>
    </select>
  </div>

  <div id="stationsView" style="display: flex;">
    <h1>Stacje pogodowe NOAA</h1>
    <div class="controls">
      <button id="fetchStationsButton">Pobierz stacje</button>
    </div>
    <div id="stationsErrorMessages" class="errorMessage"></div>
    <table id="stationsResultsTable">
      <thead>
        <tr>
          <th>Station ID</th>
          <th>Name</th>
          <th>Latitude</th>
          <th>Longitude</th>
        </tr>
      </thead>
      <tbody id="stationsResultsBody">
      </tbody>
    </table>
  </div>

  <div id="datasetsView" style="display: none;">
    <h1>Zbiory Danych NOAA</h1>
    <div class="controls">
      <button id="fetchDatasetsButton">Pobierz zbiory</button>
    </div>
    <div id="datasetsErrorMessages" class="errorMessage"></div>
    <table id="datasetsResultsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Min. Date</th>
          <th>Max. Date</th>
        </tr>
      </thead>
      <tbody id="datasetsResultsBody">
      </tbody>
    </table>
  </div>

  <div id="dataView" style="display: none;">
    <h1>Pobierz dane (z parametrami)</h1>

    <form id="dataForm">
      <div class="form-group">
        <label for="datasetInput">Dataset ID:</label>
        <input type="text" id="datasetInput" value="GHCND">
      </div>
      <div class="form-group">
        <label for="locationInput">Location ID:</label>
        <input type="text" id="locationInput" value="ZIP:28801">
      </div>
      <div class="form-group">
        <label for="startDateInput">Start Date (YYYY-MM-DD):</label>
        <input type="date" id="startDateInput" value="2010-05-01">
      </div>
      <div class="form-group">
        <label for="endDateInput">End Date (YYYY-MM-DD):</label>
        <input type="date" id="endDateInput" value="2010-05-01">
      </div>
      <button type="submit">Pobierz dane</button>
    </form>

    <div id="dataErrorMessages" class="errorMessage"></div>
    <table id="dataResultsTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Data Type</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody id="dataResultsBody">
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>

</html>
